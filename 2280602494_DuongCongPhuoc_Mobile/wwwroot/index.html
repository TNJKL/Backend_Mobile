<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding App - Module 3 Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Wedding App - Test Module Thực Đơn</h1>
    <div id="auth-status">Chưa đăng nhập</div>
  </header>

  <main>
    <section id="auth-section">
      <div class="card">
        <h2>Đăng ký</h2>
        <form id="register-form">
          <input type="text" id="reg-username" placeholder="Username" required>
          <input type="email" id="reg-email" placeholder="Email" required>
          <input type="password" id="reg-password" placeholder="Password" required>
          <input type="text" id="reg-initials" placeholder="Initials (VD: DP)">
          <button type="submit">Đăng ký</button>
          <div class="message" id="register-msg"></div>
        </form>
      </div>
      <div class="card">
        <h2>Đăng nhập</h2>
        <form id="login-form">
          <input type="text" id="login-username" placeholder="Username" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit">Đăng nhập</button>
          <div class="message" id="login-msg"></div>
        </form>
      </div>
    </section>

    <section id="app-section" class="hidden">
      <div class="card">
        <h2>Sự kiện của tôi</h2>
        <div class="row">
          <select id="event-select"></select>
          <button id="reload-events">Tải lại sự kiện</button>
        </div>
        <div class="message" id="events-msg"></div>
      </div>

      <div class="card">
        <h2>Thực đơn (Menus)</h2>
        <div class="row">
          <button id="load-menus">Tải thực đơn</button>
        </div>
        <div id="menus-list"></div>
      </div>

      <div class="card">
        <h3>Tạo thực đơn mới</h3>
        <form id="menu-create-form">
          <select id="menu-mealtype">
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
          </select>
          <input type="text" id="menu-name" placeholder="Tên thực đơn" required>
          <input type="text" id="menu-description" placeholder="Mô tả">
          <button type="submit">Tạo thực đơn</button>
          <div class="message" id="menu-create-msg"></div>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
